<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Definições de Gradiente -->
    <defs>
        <linearGradient id="gradVerde" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1b5e20;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradVerdeNeon" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#69f0ae;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="gradAzul" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Símbolo: Folha + Elementos Digitais -->
    <g transform="translate(5, 5)">
        <!-- Círculo de fundo (Globo sutil) -->
        <circle cx="25" cy="25" r="23" fill="url(#gradAzul)" opacity="0.15"/>
        
        <!-- Linhas de circuito (tecnologia) -->
        <path d="M 35 15 L 45 15" stroke="url(#gradVerde)" stroke-width="1.5" opacity="0.6"/>
        <path d="M 35 25 L 45 25" stroke="url(#gradVerde)" stroke-width="1.5" opacity="0.6"/>
        <path d="M 35 35 L 45 35" stroke="url(#gradVerde)" stroke-width="1.5" opacity="0.6"/>
        <circle cx="47" cy="15" r="2" fill="url(#gradVerdeNeon)"/>
        <circle cx="47" cy="25" r="2" fill="url(#gradVerdeNeon)"/>
        <circle cx="47" cy="35" r="2" fill="url(#gradVerdeNeon)"/>
        
        <!-- Folha estilizada -->
        <path d="M 25 8 
                 C 25 8, 18 15, 18 25 
                 C 18 35, 25 42, 25 42 
                 C 25 42, 32 35, 32 25 
                 C 32 15, 25 8, 25 8 Z" 
              fill="url(#gradVerde)" filter="url(#glow)"/>
        
        <!-- Veia da folha -->
        <path d="M 25 12 L 25 38" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
        <path d="M 25 20 L 20 25" stroke="#fff" stroke-width="1" opacity="0.6"/>
        <path d="M 25 25 L 30 20" stroke="#fff" stroke-width="1" opacity="0.6"/>
        <path d="M 25 30 L 20 35" stroke="#fff" stroke-width="1" opacity="0.6"/>
        <path d="M 25 33 L 30 28" stroke="#fff" stroke-width="1" opacity="0.6"/>
        
        <!-- Pontos de conexão (digital) -->
        <circle cx="25" cy="12" r="2" fill="#69f0ae"/>
        <circle cx="25" cy="38" r="2" fill="#69f0ae"/>
    </g>
    
    <!-- Texto: IMPACTO -->
    <text x="55" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#1b5e20" letter-spacing="1">
        IMPACTO
    </text>
    
    <!-- Texto: VERDE (destacado) -->
    <text x="145" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="url(#gradVerdeNeon)" letter-spacing="1">
        VERDE
    </text>
    
    <!-- Linha decorativa -->
    <line x1="55" y1="40" x2="185" y2="40" stroke="url(#gradVerde)" stroke-width="2" opacity="0.5"/>
</svg>